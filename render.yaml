# ClozeHive — Render Blueprint (Infrastructure as Code)
# Docs: https://render.com/docs/infrastructure-as-code
#
# Deploy: connect this repo in Render Dashboard → New → Blueprint → apply render.yaml
#
# After first deploy, set these in the Dashboard (sync: false below):
#   - OPENAI_API_KEY, JWT_SECRET (or use generateValue where noted)
#   - GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET
#   - GOOGLE_REDIRECT_URI = https://<clozehive-api-host>/api/v1/auth/google/callback
#   - ALLOWED_ORIGINS = https://<cloze-hive-frontend-host>,https://<clozehive-api-host>
#   - GCS_* if you want persistent uploads (Render disk is ephemeral)
#
# Note: MCP tool servers (mcp-weather/outfit/packing) are not in this blueprint.
#       ai-agent runs with ENABLE_MCP_TOOLS=false (LLM-only). Enable MCP only if you
#       add those services separately.

databases:
  - name: clozehive-db
    databaseName: clozehive
    user: clozehive
    plan: free
    postgresMajorVersion: "16"
    ipAllowList: []

services:
  # ── Cache Redis (evictable) — closet/profile/AI/vision caches, previews ─────
  - type: redis
    name: clozehive-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  # ── State Redis (NON-evictable) — OAuth CSRF/code, refresh tokens, rate
  #    limits, ARQ queue. These must never be evicted under memory pressure.
  #    NOTE: Render allows one free Redis per account; this second instance may
  #    require a paid plan. If you cannot provision it, delete this service and
  #    the REDIS_STATE_URL / ARQ_REDIS_URL entries below — the app falls back to
  #    clozehive-redis automatically (effective_redis_state_url → redis_url).
  - type: redis
    name: clozehive-redis-state
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

  # ── API Gateway (public API + embedded vision/closet pipelines) ─────────────
  - type: web
    name: clozehive-api
    runtime: docker
    plan: free
    region: oregon
    # ── Autoscaling ──────────────────────────────────────────────────────────
    # Requires a Standard plan or higher (free/starter cannot autoscale). When you
    # upgrade, bump `plan` above and uncomment the block below. Graceful drain
    # (SHUTDOWN_DRAIN_SECONDS) is already wired so scale-in won't cut live requests.
    # scaling:
    #   minInstances: 1
    #   maxInstances: 3
    #   targetCPUPercent: 70
    #   targetMemoryPercent: 70
    dockerfilePath: services/api-gateway/Dockerfile
    dockerContext: services/api-gateway
    healthCheckPath: /live
    # Render routes traffic to $PORT — override Dockerfile's fixed :8000
    dockerCommand: >-
      uvicorn app.main:app
      --host 0.0.0.0
      --port $PORT
      --workers 1
      --no-access-log
      --proxy-headers
      --forwarded-allow-ips=*
    envVars:
      # Free tier has no pre-deploy hook — run `alembic upgrade head` on startup
      # instead (idempotent; gated by this flag in app/core/db_migrate.py).
      - key: RUN_MIGRATIONS_ON_STARTUP
        value: "true"
      # Do NOT crash the boot if startup migrations fail/time out. Migrations run
      # inside the FastAPI lifespan (before the port binds); paired with the 15s
      # migration lock_timeout (alembic/env.py), a blocked migration now errors
      # fast and the app still starts serving (/live passes, /ready reports the
      # issue) instead of hanging the boot into a health-check restart loop.
      - key: FAIL_ON_STARTUP_MIGRATION_ERROR
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: clozehive-db
          property: connectionString
      # Optional read replica for read-only endpoints (closet list/get/similar).
      # Paste a replica connection string in the Dashboard, or leave unset to use
      # DATABASE_URL (the app falls back automatically). Render Postgres replicas
      # require a paid plan; Neon offers read replicas on its free tier.
      - key: DATABASE_READ_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: clozehive-redis
          property: connectionString
      # State Redis (non-evictable): OAuth CSRF/code, refresh tokens, rate limits.
      - key: REDIS_STATE_URL
        fromService:
          type: redis
          name: clozehive-redis-state
          property: connectionString
      # ARQ task queue lives on the non-evictable state Redis. Must match
      # clozehive-ai-worker if/when the worker is re-added to the blueprint.
      - key: ARQ_REDIS_URL
        fromService:
          type: redis
          name: clozehive-redis-state
          property: connectionString
      # Free-tier mode: keep heavy post-write work in-process (no paid worker).
      - key: HEAVY_WORK_ASYNC
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: INTERNAL_SERVICE_TOKEN
        generateValue: true
      - key: ENVIRONMENT
        value: production
      # The frontend calls clozehive-api directly (VITE_API_URL = this service)
      # and the gateway is the sole owner of the wardrobe domain (closet/outfits/
      # ai). Those routers default to OFF in production, so this override is
      # REQUIRED — without it every /api/v1/closet, /outfits, /ai request 404s.
      # (The closet-service split was retired; the gateway serves its own copies.)
      - key: SERVE_MIGRATED_DOMAIN_ROUTES
        value: "true"
      - key: DEBUG
        value: "false"
      - key: REDIS_CHECK_ON_READY
        value: "true"
      # Drain window on shutdown — /ready flips to 503 and the LB stops routing
      # before connections are torn down. Matters most with autoscaling/zero-downtime deploys.
      - key: SHUTDOWN_DRAIN_SECONDS
        value: "5"
      # ── Observability ────────────────────────────────────────────────────
      - key: ENABLE_METRICS
        value: "true"
      # Sentry error tracking — paste a DSN in the Dashboard (or leave unset).
      - key: SENTRY_DSN
        sync: false
      # OpenTelemetry tracing — set OTEL_ENABLED=true + an OTLP endpoint to turn on.
      - key: OTEL_ENABLED
        value: "false"
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: OTEL_SERVICE_NAME
        value: api-gateway
      - key: KAFKA_ENABLED
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: OPENAI_MAX_TOKENS
        value: "1024"
      - key: OPENAI_API_BASE_URL
        value: https://api.openai.com/v1
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: Lax
      - key: VISION_PREVIEW_FAST
        value: "true"
      - key: RAG_VECTOR_STORE
        value: pgvector
      # AI agent (public Render URL — gateway calls over HTTPS)
      - key: AI_AGENT_URL
        fromService:
          type: web
          name: clozehive-ai-agent
          envVarKey: RENDER_EXTERNAL_URL
      - key: AI_TIMEOUT_SECONDS
        value: "90"
      # Frontend origin for OAuth redirects and emails
      - key: FRONTEND_URL
        fromService:
          type: web
          name: cloze-hive
          envVarKey: RENDER_EXTERNAL_URL
      # Transactional email (password reset). The default 'console' provider only
      # LOGS mail — reset emails are never delivered. Use Resend in production:
      # set RESEND_API_KEY (Dashboard secret) and EMAIL_FROM to a verified sender
      # on your Resend domain, e.g. "Clozehive <no-reply@yourdomain.com>".
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Secrets — set in Render Dashboard after blueprint sync
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GCS_BUCKET_NAME
        sync: false
      - key: GCS_PROJECT_ID
        sync: false
      - key: GCS_CREDENTIALS_JSON
        sync: false
      - key: SENTRY_DSN
        sync: false

  # ── AI Agent (stylist chat, packing, outfit tools — LLM-only on Render) ─────
  - type: web
    name: clozehive-ai-agent
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: services/ai-agent/Dockerfile
    dockerContext: services/ai-agent
    healthCheckPath: /health
    dockerCommand: >-
      uvicorn app.main:app
      --host 0.0.0.0
      --port $PORT
      --loop asyncio
      --no-access-log
      --proxy-headers
      --forwarded-allow-ips=*
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: clozehive-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: clozehive-redis
          property: connectionString
      - key: INTERNAL_SERVICE_TOKEN
        fromService:
          type: web
          name: clozehive-api
          envVarKey: INTERNAL_SERVICE_TOKEN
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: OPENAI_API_BASE_URL
        value: https://api.openai.com/v1
      - key: VECTOR_STORE
        value: pgvector
      # No mcp-* containers on Render — LLM-only agent
      - key: ENABLE_MCP_TOOLS
        value: "false"
      - key: ENABLE_MCP_VISION
        value: "false"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false

  # ── AI Worker (ARQ async jobs) — disabled in free-tier mode ─────────────────
  # Render workers require a paid plan. Keep this disabled until you upgrade.

  # ── Frontend (static SPA) ───────────────────────────────────────────────────
  - type: web
    name: cloze-hive
    runtime: static
    # Static sites have no instance plan or region — both are rejected by Render.
    # npm's optional-deps bug (npm/cli#4828) makes `npm ci` skip rollup's native
    # @rollup/rollup-linux-x64-gnu binary on Linux, breaking `vite build`. A fresh
    # `npm install` (after clearing the lock + modules) resolves the right binary.
    buildCommand: cd frontend && rm -rf node_modules package-lock.json && npm install --no-audit --no-fund && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Content-hashed Vite assets are immutable — cache hard at browser + CDN.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # The SPA shell (index.html and everything else) must always revalidate so
      # a deploy's new asset references are picked up immediately.
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    envVars:
      # Pin Node 22 (bundles npm 10). Render's default Node 24 ships npm 11,
      # whose stricter `npm ci` rejects this lockfile's esbuild/rollup optional
      # platform deps ("Missing … from lock file"). Node 22 matches the npm that
      # generated package-lock.json, so `npm ci` succeeds.
      - key: NODE_VERSION
        value: "22.15.0"
      - key: VITE_API_URL
        fromService:
          type: web
          name: clozehive-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_HIDE_NON_MVP
        value: "true"
      # Frontend error tracking + Web Vitals (Sentry). Paste a browser DSN, or
      # leave unset — observability.ts no-ops without it.
      - key: VITE_SENTRY_DSN
        sync: false
      - key: VITE_ENVIRONMENT
        value: production
