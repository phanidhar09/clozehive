# ClozeHive — Render Blueprint (Infrastructure as Code)
# Docs: https://render.com/docs/infrastructure-as-code
#
# Deploy: connect this repo in Render Dashboard → New → Blueprint → apply render.yaml
#
# After first deploy, set these in the Dashboard (sync: false below):
#   - OPENAI_API_KEY, JWT_SECRET (or use generateValue where noted)
#   - GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET
#   - GOOGLE_REDIRECT_URI = https://<clozehive-api-host>/api/v1/auth/google/callback
#   - ALLOWED_ORIGINS = https://<cloze-hive-frontend-host>,https://<clozehive-api-host>
#   - GCS_* if you want persistent uploads (Render disk is ephemeral)
#
# Note: all AI (stylist chat, outfit, vision, packing) runs in-process in the
#       api-gateway. The only optional side service is clozehive-worker (ARQ),
#       which offloads latency-insensitive heavy jobs (closet embedding refresh)
#       off the web request path when HEAVY_WORK_ASYNC=true. There is no
#       ai-agent / ai-worker service.

databases:
  - name: clozehive-db
    databaseName: clozehive
    user: clozehive
    plan: free
    postgresMajorVersion: "16"
    ipAllowList: []

services:
  # ── Cache Redis (evictable) — closet/profile/AI/vision caches, previews ─────
  - type: redis
    name: clozehive-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  # ── State Redis (NON-evictable) — OAuth CSRF/code, refresh tokens, rate
  #    limits. These must never be evicted under memory pressure.
  #    NOTE: Render allows one free Redis per account; this second instance may
  #    require a paid plan. If you cannot provision it, delete this service and
  #    the REDIS_STATE_URL entry below — the app falls back to
  #    clozehive-redis automatically (effective_redis_state_url → redis_url).
  - type: redis
    name: clozehive-redis-state
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

  # ── Background worker (ARQ) — offloads CPU/latency-heavy work off the web
  #    request path: closet embedding refresh (add more jobs in app/worker.py).
  #    Consumes from the STATE Redis (noeviction) so queued jobs are never
  #    evicted under memory pressure — the cache Redis is allkeys-lru and would
  #    drop jobs. Background removal is intentionally NOT offloaded: it runs in
  #    the live vision SSE stream, so the user is actively watching.
  #    NOTE: Render workers cannot run on the free plan; smallest tier is starter.
  #    Only deployed to effect once HEAVY_WORK_ASYNC=true on both services.
  - type: worker
    name: clozehive-worker
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: services/api-gateway/Dockerfile
    dockerContext: services/api-gateway
    # Override the Dockerfile's uvicorn CMD — run the ARQ worker instead.
    dockerCommand: arq app.worker.WorkerSettings
    envVars:
      # Flip web + worker from in-process BackgroundTasks to enqueue/consume.
      - key: HEAVY_WORK_ASYNC
        value: "true"
      # The web service owns startup migrations. The worker must NOT race them.
      - key: RUN_MIGRATIONS_ON_STARTUP
        value: "false"
      # Same Neon DB as the web service (paste the connection string as a secret).
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: clozehive-redis
          property: connectionString
      # ARQ job queue lives on the non-evictable state Redis.
      - key: REDIS_STATE_URL
        fromService:
          type: redis
          name: clozehive-redis-state
          property: connectionString
      - key: INTERNAL_SERVICE_TOKEN
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: ENABLE_METRICS
        value: "true"
      # AI / embedding config — must match the web service.
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: OPENAI_API_BASE_URL
        value: https://api.openai.com/v1
      # Secrets — set in Dashboard (same values as clozehive-api).
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GCS_BUCKET_NAME
        sync: false
      - key: GCS_PROJECT_ID
        sync: false
      - key: GCS_CREDENTIALS_JSON
        sync: false
      - key: SENTRY_DSN
        sync: false

  # ── API Gateway (public API + embedded vision/closet pipelines) ─────────────
  - type: web
    name: clozehive-api
    runtime: docker
    plan: free
    region: oregon
    # ── Autoscaling ──────────────────────────────────────────────────────────
    # Requires a Standard plan or higher (free/starter cannot autoscale). When you
    # upgrade, bump `plan` above and uncomment the block below. Graceful drain
    # (SHUTDOWN_DRAIN_SECONDS) is already wired so scale-in won't cut live requests.
    # scaling:
    #   minInstances: 1
    #   maxInstances: 3
    #   targetCPUPercent: 70
    #   targetMemoryPercent: 70
    dockerfilePath: services/api-gateway/Dockerfile
    dockerContext: services/api-gateway
    healthCheckPath: /live
    # Render routes traffic to $PORT — override Dockerfile's fixed :8000
    dockerCommand: >-
      uvicorn app.main:app
      --host 0.0.0.0
      --port $PORT
      --workers 1
      --no-access-log
      --proxy-headers
      --forwarded-allow-ips=*
    envVars:
      # Free tier has no pre-deploy hook — run `alembic upgrade head` on startup
      # instead (idempotent; gated by this flag in app/core/db_migrate.py).
      - key: RUN_MIGRATIONS_ON_STARTUP
        value: "true"
      # Do NOT crash the boot if startup migrations fail/time out. Migrations run
      # inside the FastAPI lifespan (before the port binds); paired with the 15s
      # migration lock_timeout (alembic/env.py), a blocked migration now errors
      # fast and the app still starts serving (/live passes, /ready reports the
      # issue) instead of hanging the boot into a health-check restart loop.
      - key: FAIL_ON_STARTUP_MIGRATION_ERROR
        value: "false"
      # Primary database = Neon (set the Neon connection string as a Dashboard
      # secret on this service). Paste it as-is — the app strips Neon's
      # ?sslmode=require and applies SSL via connect_args (see normalise_db_url /
      # db/session.py). On first boot set RUN_MIGRATIONS_ON_STARTUP=true so the
      # schema is created in the empty Neon DB.
      - key: DATABASE_URL
        sync: false
      # Optional read replica for read-only endpoints (closet list/get/similar).
      # Paste a replica connection string in the Dashboard, or leave unset to use
      # DATABASE_URL (the app falls back automatically). Render Postgres replicas
      # require a paid plan; Neon offers read replicas on its free tier.
      - key: DATABASE_READ_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: clozehive-redis
          property: connectionString
      # State Redis (non-evictable): OAuth CSRF/code, refresh tokens, rate limits.
      - key: REDIS_STATE_URL
        fromService:
          type: redis
          name: clozehive-redis-state
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: INTERNAL_SERVICE_TOKEN
        generateValue: true
      - key: ENVIRONMENT
        value: production
      # The frontend calls clozehive-api directly (VITE_API_URL = this service)
      # and the gateway is the sole owner of the wardrobe domain (closet/outfits/
      # ai). Those routers default to OFF in production, so this override is
      # REQUIRED — without it every /api/v1/closet, /outfits, /ai request 404s.
      # (The closet-service split was retired; the gateway serves its own copies.)
      - key: SERVE_MIGRATED_DOMAIN_ROUTES
        value: "true"
      # When true, heavy jobs (embedding refresh) are enqueued to clozehive-worker
      # instead of run in-process. MUST match the worker's value. Set to "false"
      # (or leave unset) to keep single-dyno in-process behaviour — the app falls
      # back to in-process automatically if the queue is ever unreachable.
      - key: HEAVY_WORK_ASYNC
        value: "true"
      - key: DEBUG
        value: "false"
      - key: REDIS_CHECK_ON_READY
        value: "true"
      # Drain window on shutdown — /ready flips to 503 and the LB stops routing
      # before connections are torn down. Matters most with autoscaling/zero-downtime deploys.
      - key: SHUTDOWN_DRAIN_SECONDS
        value: "5"
      # ── Observability ────────────────────────────────────────────────────
      - key: ENABLE_METRICS
        value: "true"
      # Sentry error tracking — paste a DSN in the Dashboard (or leave unset).
      - key: SENTRY_DSN
        sync: false
      # OpenTelemetry tracing — set OTEL_ENABLED=true + an OTLP endpoint to turn on.
      - key: OTEL_ENABLED
        value: "false"
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: OTEL_SERVICE_NAME
        value: api-gateway
      - key: KAFKA_ENABLED
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: OPENAI_MODEL_SMALL
        value: gpt-4o-mini
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: OPENAI_MAX_TOKENS
        value: "1024"
      - key: MODEL_ROUTER_ARBITER_ENABLED
        value: "true"
      - key: MODEL_ROUTER_ARBITER_TIMEOUT_MS
        value: "400"
      - key: SEMANTIC_CACHE_ENABLED
        value: "true"
      - key: OPENAI_API_BASE_URL
        value: https://api.openai.com/v1
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: Lax
      - key: VISION_PREVIEW_FAST
        value: "true"
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: RAG_VECTOR_STORE
        value: pgvector
      # Frontend origin for OAuth redirects and emails
      - key: FRONTEND_URL
        fromService:
          type: web
          name: cloze-hive
          envVarKey: RENDER_EXTERNAL_URL
      # Secrets — set in Render Dashboard after blueprint sync
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GCS_BUCKET_NAME
        sync: false
      - key: GCS_PROJECT_ID
        sync: false
      - key: GCS_CREDENTIALS_JSON
        sync: false
      - key: SENTRY_DSN
        sync: false

  # ── Frontend (static SPA) ───────────────────────────────────────────────────
  - type: web
    name: cloze-hive
    runtime: static
    # Static sites have no instance plan or region — both are rejected by Render.
    # npm's optional-deps bug (npm/cli#4828) makes `npm ci` skip rollup's native
    # @rollup/rollup-linux-x64-gnu binary on Linux, breaking `vite build`. A fresh
    # `npm install` (after clearing the lock + modules) resolves the right binary.
    buildCommand: cd frontend && rm -rf node_modules package-lock.json && npm install --no-audit --no-fund && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Content-hashed Vite assets are immutable — cache hard at browser + CDN.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # The SPA shell (index.html and everything else) must always revalidate so
      # a deploy's new asset references are picked up immediately.
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    envVars:
      # Pin Node 22 (bundles npm 10). Render's default Node 24 ships npm 11,
      # whose stricter `npm ci` rejects this lockfile's esbuild/rollup optional
      # platform deps ("Missing … from lock file"). Node 22 matches the npm that
      # generated package-lock.json, so `npm ci` succeeds.
      - key: NODE_VERSION
        value: "22.15.0"
      - key: VITE_API_URL
        fromService:
          type: web
          name: clozehive-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_HIDE_NON_MVP
        value: "true"
      # Frontend error tracking + Web Vitals (Sentry). Paste a browser DSN, or
      # leave unset — observability.ts no-ops without it.
      - key: VITE_SENTRY_DSN
        sync: false
      # Source-map upload at build time (de-minifies prod stack traces). All
      # three must be set or the upload is skipped (build still succeeds).
      - key: SENTRY_AUTH_TOKEN
        sync: false
      - key: SENTRY_ORG
        sync: false
      - key: SENTRY_PROJECT
        value: clozehive-frontend
      # Product analytics (PostHog). Paste the project API key, or leave unset —
      # observability.ts no-ops without it. Host defaults to US cloud.
      - key: VITE_POSTHOG_KEY
        sync: false
      - key: VITE_POSTHOG_HOST
        value: https://us.i.posthog.com
      - key: VITE_ENVIRONMENT
        value: production
