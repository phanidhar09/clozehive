# ClozeHive — Render Blueprint (Infrastructure as Code)
# Docs: https://render.com/docs/infrastructure-as-code
#
# Deploy: connect this repo in Render Dashboard → New → Blueprint → apply render.yaml
#
# After first deploy, set these in the Dashboard (sync: false below):
#   - OPENAI_API_KEY, JWT_SECRET (or use generateValue where noted)
#   - GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET
#   - GOOGLE_REDIRECT_URI = https://<clozehive-api-host>/api/v1/auth/google/callback
#   - ALLOWED_ORIGINS = https://<cloze-hive-frontend-host>,https://<clozehive-api-host>
#   - GCS_* if you want persistent uploads (Render disk is ephemeral)
#
# Note: MCP tool servers (mcp-weather/outfit/packing) are not in this blueprint.
#       ai-agent runs with ENABLE_MCP_TOOLS=false (LLM-only). Enable MCP only if you
#       add those services separately.

databases:
  - name: clozehive-db
    databaseName: clozehive
    user: clozehive
    plan: free
    postgresMajorVersion: "16"
    ipAllowList: []

  # NOTE: closet-service uses a FREE external Postgres (Neon), not a Render DB,
  # because Render allows only one free Postgres per account. Its DATABASE_URL is
  # set as a Dashboard secret on the clozehive-closet service (sync: false).

services:
  # ── Redis (cache, OAuth state, sessions, closet previews) ───────────────────
  - type: redis
    name: clozehive-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  # ── API Gateway (public API + embedded vision/closet pipelines) ─────────────
  - type: web
    name: clozehive-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: services/api-gateway/Dockerfile
    dockerContext: services/api-gateway
    healthCheckPath: /live
    # Render routes traffic to $PORT — override Dockerfile's fixed :8000
    dockerCommand: >-
      uvicorn app.main:app
      --host 0.0.0.0
      --port $PORT
      --workers 1
      --no-access-log
      --proxy-headers
      --forwarded-allow-ips=*
    envVars:
      # Free tier has no pre-deploy hook — run `alembic upgrade head` on startup
      # instead (idempotent; gated by this flag in app/core/db_migrate.py).
      - key: RUN_MIGRATIONS_ON_STARTUP
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: clozehive-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: clozehive-redis
          property: connectionString
      # ARQ task queue shares the same Redis as the cache (ARQ keys are
      # `arq:`-prefixed, so no collision). Must match clozehive-ai-worker.
      - key: ARQ_REDIS_URL
        fromService:
          type: redis
          name: clozehive-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: INTERNAL_SERVICE_TOKEN
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: REDIS_CHECK_ON_READY
        value: "true"
      - key: KAFKA_ENABLED
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: OPENAI_MAX_TOKENS
        value: "1024"
      - key: OPENAI_API_BASE_URL
        value: https://api.openai.com/v1
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: Lax
      - key: VISION_PREVIEW_FAST
        value: "true"
      - key: RAG_VECTOR_STORE
        value: pgvector
      # AI agent (public Render URL — gateway calls over HTTPS)
      - key: AI_AGENT_URL
        fromService:
          type: web
          name: clozehive-ai-agent
          envVarKey: RENDER_EXTERNAL_URL
      - key: AI_TIMEOUT_SECONDS
        value: "90"
      # Frontend origin for OAuth redirects and emails
      - key: FRONTEND_URL
        fromService:
          type: web
          name: cloze-hive
          envVarKey: RENDER_EXTERNAL_URL
      # Secrets — set in Render Dashboard after blueprint sync
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GCS_BUCKET_NAME
        sync: false
      - key: GCS_PROJECT_ID
        sync: false
      - key: GCS_CREDENTIALS_JSON
        sync: false
      - key: SENTRY_DSN
        sync: false

  # ── Closet Service (wardrobe domain + closet-heavy AI; own Postgres) ────────
  # Not yet routed by nginx/gateway (Phase 4 cutover pending) — reachable at its
  # own Render URL. Validates gateway-issued JWTs locally via shared JWT_SECRET.
  - type: web
    name: clozehive-closet
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: services/closet-service/Dockerfile
    dockerContext: services/closet-service
    healthCheckPath: /live
    # Render injects $PORT; override the Dockerfile's fixed :8003
    dockerCommand: >-
      uvicorn app.main:app
      --host 0.0.0.0
      --port $PORT
      --workers 1
      --no-access-log
      --proxy-headers
      --forwarded-allow-ips=*
    envVars:
      # Free tier has no pre-deploy hook — apply the baseline closet schema on
      # startup instead (idempotent; gated by this flag in app/core/db_migrate.py).
      - key: RUN_MIGRATIONS_ON_STARTUP
        value: "true"
      # Free external Postgres (Neon). Paste the Neon connection string in the
      # Dashboard. Format: postgresql://USER:PASS@HOST/DB?sslmode=require
      # (closet-service auto-enables SSL for neon.tech hosts and rewrites the
      # scheme to postgresql+asyncpg). The baseline 13-table schema is applied on
      # first boot via RUN_MIGRATIONS_ON_STARTUP above.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: clozehive-redis
          property: connectionString
      - key: ARQ_REDIS_URL
        fromService:
          type: redis
          name: clozehive-redis
          property: connectionString
      # MUST be byte-identical to clozehive-api's JWT_SECRET — closet-service
      # validates gateway-issued JWTs locally with this shared secret.
      - key: JWT_SECRET
        fromService:
          type: web
          name: clozehive-api
          envVarKey: JWT_SECRET
      - key: INTERNAL_SERVICE_TOKEN
        fromService:
          type: web
          name: clozehive-api
          envVarKey: INTERNAL_SERVICE_TOKEN
      # Off-hot-path calls that need user account details from the gateway
      - key: GATEWAY_INTERNAL_URL
        fromService:
          type: web
          name: clozehive-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: AI_AGENT_URL
        fromService:
          type: web
          name: clozehive-ai-agent
          envVarKey: RENDER_EXTERNAL_URL
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: REDIS_CHECK_ON_READY
        value: "true"
      - key: LOG_LEVEL
        value: INFO
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: OPENAI_API_BASE_URL
        value: https://api.openai.com/v1
      - key: OPENAI_MAX_TOKENS
        value: "1024"
      - key: VISION_PREVIEW_FAST
        value: "true"
      - key: RAG_VECTOR_STORE
        value: pgvector
      # Secrets — set in Render Dashboard after blueprint sync.
      # ALLOWED_ORIGINS is REQUIRED: with ENVIRONMENT=production the service
      # refuses to boot if it's empty or contains "localhost".
      - key: ALLOWED_ORIGINS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Render disk is ephemeral — set GCS_* for persistent uploads
      - key: GCS_BUCKET_NAME
        sync: false
      - key: GCS_PROJECT_ID
        sync: false
      - key: GCS_CREDENTIALS_JSON
        sync: false
      - key: SENTRY_DSN
        sync: false

  # ── AI Agent (stylist chat, packing, outfit tools — LLM-only on Render) ─────
  - type: web
    name: clozehive-ai-agent
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: services/ai-agent/Dockerfile
    dockerContext: services/ai-agent
    healthCheckPath: /health
    dockerCommand: >-
      uvicorn app.main:app
      --host 0.0.0.0
      --port $PORT
      --loop asyncio
      --no-access-log
      --proxy-headers
      --forwarded-allow-ips=*
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: clozehive-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: clozehive-redis
          property: connectionString
      - key: INTERNAL_SERVICE_TOKEN
        fromService:
          type: web
          name: clozehive-api
          envVarKey: INTERNAL_SERVICE_TOKEN
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: OPENAI_API_BASE_URL
        value: https://api.openai.com/v1
      - key: VECTOR_STORE
        value: pgvector
      # No mcp-* containers on Render — LLM-only agent
      - key: ENABLE_MCP_TOOLS
        value: "false"
      - key: ENABLE_MCP_VISION
        value: "false"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false

  # ── AI Worker (ARQ async jobs) — REMOVED from blueprint ─────────────────────
  # Render workers require a PAID instance type, so it's excluded to keep this
  # blueprint free-tier. Async outfit/packing/vision jobs stay disabled until you
  # re-add this `type: worker` block (plan: starter) when you move to a paid plan.

  # ── Frontend (static SPA) ───────────────────────────────────────────────────
  - type: web
    name: cloze-hive
    runtime: static
    # Static sites have no instance plan or region — both are rejected by Render.
    buildCommand: cd frontend && npm ci --no-audit --no-fund && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: clozehive-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_HIDE_NON_MVP
        value: "true"
