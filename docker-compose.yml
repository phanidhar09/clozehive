# ═══════════════════════════════════════════════════════════════════════════════
#  CLOZEHIVE — Simplified Architecture
#
#  ── Default stack ──────────────────────────────────────────────────────────────
#  Starts: postgres, redis, api-gateway, ai-agent, vision-service, frontend, nginx, migrate
#  Command:
#    docker compose up --build
#
#  Architecture:
#    Frontend → nginx → api-gateway (auth/CRUD)
#                    └→ api-gateway /ai/* → ai-agent (inline tools: weather/outfit/packing)
#
#  ai-agent runs weather, outfit, and packing logic in-process — no external MCP servers.
#
#  ── Optional: Vision MCP (GPU / high-memory) ──────────────────────────────────
#  Command:
#    docker compose --profile vision up --build
#
#  Stop / reset volumes:
#    docker compose down -v
# ═══════════════════════════════════════════════════════════════════════════════

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

# ── Shared env for Python services ───────────────────────────────────────────
x-python-env: &python-env
  OPENAI_API_KEY: ${OPENAI_API_KEY}
  ENVIRONMENT: ${ENVIRONMENT:-development}
  DEBUG: ${DEBUG:-false}
  LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
  LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
  LANGSMITH_API_KEY: ${LANGSMITH_API_KEY}
  LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-clozehive1}

services:

  # ── Infrastructure (MVP default) ──────────────────────────────────────────

  postgres:
    image: pgvector/pgvector:pg16
    <<: [*restart, *logging]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Host 5433 → container 5432 so we don't clash with a local Postgres install.
      # Override by setting POSTGRES_HOST_PORT in .env if you want a different mapping.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── closet-service database (separate DB for the wardrobe domain) ───────────
  # Own Postgres so closet/vision/RAG load is isolated from auth/users. Same
  # init.sql enables pgvector. user_id columns here have NO FK to users (that
  # table lives in the api-gateway DB); cleanup is via the internal purge seam.
  postgres-closet:
    image: pgvector/pgvector:pg16
    <<: [*restart, *logging]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${CLOSET_POSTGRES_DB:-clozehive_closet}
    ports:
      - "${CLOSET_POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - postgres_closet_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${CLOSET_POSTGRES_DB:-clozehive_closet}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cache Redis — evictable (allkeys-lru). Safe to drop keys under memory pressure.
  redis:
    image: redis:7-alpine
    <<: [*restart, *logging]
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory ${REDIS_MAXMEMORY:-512mb}
      --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_HOST_PORT:-6382}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # State Redis — NON-evictable (noeviction). Holds OAuth CSRF/code state,
  # refresh tokens, ARQ jobs, and rate-limit counters: data that must survive
  # memory pressure. Evicting these silently breaks logins and rate limiting.
  redis-state:
    image: redis:7-alpine
    <<: [*restart, *logging]
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory ${REDIS_STATE_MAXMEMORY:-256mb}
      --maxmemory-policy noeviction
    ports:
      - "${REDIS_STATE_HOST_PORT:-6383}:6379"
    volumes:
      - redis_state_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Mailpit — local SMTP catcher for dev. All app email (password resets, etc.)
  # lands here instead of real inboxes. Web UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    <<: [*restart, *logging]
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"   # web UI
      - "${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP (for running services on the host)
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Vision MCP (optional — higher resource usage) ───────────────────────────
  mcp-vision:
    profiles: ["vision", "legacy-mcp"]
    build:
      context: ./services/mcp
      dockerfile: vision/Dockerfile
    <<: [*restart, *logging]
    environment:
      <<: *python-env
      VISION_PORT: "8011"
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
    ports:
      - "8011:8011"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket,sys; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',8011)); s.close()\""]
      interval: 20s
      timeout: 5s
      start_period: 15s
      retries: 3

  # ── AI Agent (default — tools run in-process) ────────────────────────────────

  ai-agent:
    build:
      context: ./services/ai-agent
      dockerfile: Dockerfile
    <<: [*restart, *logging]
    environment:
      <<: *python-env
      PORT: "8001"
      REDIS_URL: redis://redis:6379/1
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      VECTOR_STORE: pgvector
      OPENAI_MODEL: gpt-4o
      # Live trip-forecast weather tool; falls back to static climate profiles when unset.
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      ENABLE_METRICS: ${ENABLE_METRICS:-true}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      OPENAI_API_BASE_URL: https://api.openai.com/v1
    ports:
      - "8001:8001"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 30s
      timeout: 15s
      start_period: 30s
      retries: 3

  # ── AI Worker (MVP default — ARQ async jobs over Redis) ──────────────────────
  #
  # Consumes jobs enqueued by api-gateway (outfit/packing/vision) from Redis db /3
  # and writes results back to the ai_requests table.

  ai-worker:
    build:
      context: ./services/ai-worker
      dockerfile: Dockerfile
    <<: [*restart, *logging]
    environment:
      <<: *python-env
      # ARQ queue lives on the non-evictable state Redis (matches api-gateway).
      REDIS_URL: redis://redis-state:6379/3
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AI_AGENT_URL: http://ai-agent:8001
      # Durable embedding task (HEAVY_WORK_ASYNC) calls back into the gateway.
      GATEWAY_INTERNAL_URL: http://api-gateway:8000
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SENTRY_DSN: ${SENTRY_DSN:-}
      ENABLE_METRICS: ${ENABLE_METRICS:-true}
      METRICS_PORT: "9104"
      ARQ_QUEUE_NAME: ${ARQ_QUEUE_NAME:-arq:queue}
      QUEUE_DEPTH_POLL_SECONDS: ${QUEUE_DEPTH_POLL_SECONDS:-15}
      AI_JOB_SLA_SECONDS: ${AI_JOB_SLA_SECONDS:-120}
    expose:
      - "9104"
    depends_on:
      redis-state:
        condition: service_healthy
      postgres:
        condition: service_healthy
      ai-agent:
        condition: service_started

  # ── API Gateway (MVP default) ────────────────────────────────────────────────

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    <<: [*restart, *logging]
    # Load repo-root `.env` into the container (same file Compose uses for ${VAR} substitution).
    env_file:
      - .env
    environment:
      <<: *python-env
      PORT: "8000"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-300}
      REDIS_URL: redis://redis:6379/0
      # State Redis (non-evictable): OAuth CSRF/code, refresh tokens, rate limits.
      REDIS_STATE_URL: redis://redis-state:6379/0
      REDIS_CHECK_ON_READY: ${REDIS_CHECK_ON_READY:-true}
      # ARQ task queue lives on the non-evictable state Redis — must match the
      # ai-worker's ARQ_REDIS_URL (db index /3).
      ARQ_REDIS_URL: redis://redis-state:6379/3
      # Offload closet embedding generation to the durable ARQ queue (needs ai-worker).
      # Default false → in-process BackgroundTasks (no worker required).
      HEAVY_WORK_ASYNC: ${HEAVY_WORK_ASYNC:-false}
      # ── Observability ───────────────────────────────────────────────────────
      ENABLE_METRICS: ${ENABLE_METRICS:-true}
      SENTRY_DSN: ${SENTRY_DSN:-}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: api-gateway
      # Must be the Compose service name, not localhost from .env (host dev uses localhost).
      AI_AGENT_URL: http://ai-agent:8001
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      # Override stale OPENAI_* proxy URLs from .env for predictable behavior in Compose.
      OPENAI_API_BASE_URL: https://api.openai.com/v1
      JWT_SECRET: ${JWT_SECRET}
      ALLOWED_ORIGINS: http://localhost,http://localhost:80,http://localhost:3000,http://localhost:3001,http://localhost:5173
      # Google OAuth — set these in your .env file
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8000/api/v1/auth/google/callback}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
      # Email — dev default routes everything into Mailpit (UI at :8025).
      # Set EMAIL_PROVIDER=resend + RESEND_API_KEY in .env to test real delivery.
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      EMAIL_FROM: ${EMAIL_FROM:-Clozehive <no-reply@clozehive.local>}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      # Firebase / Firestore — set FIREBASE_CREDENTIALS_JSON to service account JSON contents
      # or mount a credentials file and set GOOGLE_APPLICATION_CREDENTIALS to its path
      FIREBASE_CREDENTIALS_JSON: ${FIREBASE_CREDENTIALS_JSON:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      # Google Cloud Storage — must be passed explicitly (container does not load repo-root .env).
      GCS_BUCKET_NAME: ${GCS_BUCKET_NAME:-}
      GCS_PROJECT_ID: ${GCS_PROJECT_ID:-}
      GCS_CREDENTIALS_JSON: ${GCS_CREDENTIALS_JSON:-}
      GCS_CREDENTIALS_FILE: ${GCS_CREDENTIALS_FILE:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-state:
        condition: service_healthy
      ai-agent:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/live')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./services/api-gateway/app:/app/app  # live code mount — no rebuild needed for Python changes
      - uploads:/app/uploads
      # Real GCP key JSON at repo root (see .env GCS_CREDENTIALS_FILE). Create from IAM → Keys → JSON.
      - ./gcp-sa.json:/run/secrets/gcp-sa.json:ro

  # ── Closet Service (wardrobe domain + closet-data AI; own DB) ───────────────
  # Authenticates by validating the gateway-issued JWT locally (shared JWT_SECRET)
  # — no per-request call to api-gateway. Phase 0: health only, not yet routed by
  # nginx. Domain routes arrive in Phase 2.
  closet-service:
    build:
      context: ./services/closet-service
      dockerfile: Dockerfile
    <<: [*restart, *logging]
    env_file:
      - .env
    environment:
      <<: *python-env
      PORT: "8003"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-closet:5432/${CLOSET_POSTGRES_DB:-clozehive_closet}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-300}
      # Own cache index (/4); ARQ queue index (/3) matches the ai-worker so the
      # closet-service can enqueue vision/embedding jobs later.
      REDIS_URL: redis://redis:6379/4
      REDIS_STATE_URL: redis://redis-state:6379/0
      ARQ_REDIS_URL: redis://redis-state:6379/3
      REDIS_CHECK_ON_READY: ${REDIS_CHECK_ON_READY:-true}
      # MUST be byte-identical to api-gateway's JWT_SECRET or all auth 401s.
      JWT_SECRET: ${JWT_SECRET}
      AI_AGENT_URL: http://ai-agent:8001
      GATEWAY_INTERNAL_URL: http://api-gateway:8000
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      OPENAI_API_BASE_URL: https://api.openai.com/v1
      ALLOWED_ORIGINS: http://localhost,http://localhost:80,http://localhost:3000,http://localhost:3001,http://localhost:5173
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GCS_BUCKET_NAME: ${GCS_BUCKET_NAME:-}
      GCS_PROJECT_ID: ${GCS_PROJECT_ID:-}
      GCS_CREDENTIALS_JSON: ${GCS_CREDENTIALS_JSON:-}
      GCS_CREDENTIALS_FILE: ${GCS_CREDENTIALS_FILE:-}
      ENABLE_METRICS: ${ENABLE_METRICS:-true}
    ports:
      - "8003:8003"
    depends_on:
      postgres-closet:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-state:
        condition: service_healthy
      ai-agent:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8003/live')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./services/closet-service/app:/app/app  # live code mount — no rebuild for Python changes
      - ./services/closet-service/alembic:/app/alembic  # persist autogenerated migrations to host
      - uploads:/app/uploads
      - ./gcp-sa.json:/run/secrets/gcp-sa.json:ro

  # ── Vision Service (MVP default — image analysis and background removal) ─────
  # Persists analyzed closet items into the wardrobe domain DB so saved items
  # are immediately visible to closet-service readers.

  vision-service:
    build:
      context: ./services/vision-service
      dockerfile: Dockerfile
    <<: [*restart, *logging]
    env_file:
      - .env
    environment:
      <<: *python-env
      PORT: "8002"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-closet:5432/${CLOSET_POSTGRES_DB:-clozehive_closet}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-300}
      REDIS_URL: redis://redis:6379/2
      JWT_SECRET: ${JWT_SECRET}
      OPENAI_API_BASE_URL: https://api.openai.com/v1
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GCS_BUCKET_NAME: ${GCS_BUCKET_NAME:-}
      GCS_PROJECT_ID: ${GCS_PROJECT_ID:-}
      GCS_CREDENTIALS_JSON: ${GCS_CREDENTIALS_JSON:-}
      GCS_CREDENTIALS_FILE: ${GCS_CREDENTIALS_FILE:-}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
    ports:
      - "8002:8002"
    depends_on:
      postgres-closet:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/live')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - uploads:/app/uploads
      - ./gcp-sa.json:/run/secrets/gcp-sa.json:ro

  # ── DB Migrations (MVP default — run-once container) ───────────────────────

  migrate:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    command: alembic upgrade head
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ── closet-service DB migrations (run-once) ─────────────────────────────────
  # Applies closet-service alembic revisions to the clozehive_closet DB. The
  # baseline revision is generated once via autogenerate (see README/notes);
  # this container then keeps the schema up to date on every `compose up`.
  migrate-closet:
    build:
      context: ./services/closet-service
      dockerfile: Dockerfile
    command: alembic upgrade head
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-closet:5432/${CLOSET_POSTGRES_DB:-clozehive_closet}
    depends_on:
      postgres-closet:
        condition: service_healthy
    restart: "no"

  # ── Frontend (MVP default) ──────────────────────────────────────────────────

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Empty = browser calls same origin; frontend container nginx proxies `/api` + `/uploads` → api-gateway.
        # Set a full URL only if you build a static bundle meant for a separate API host.
        VITE_API_URL: ${VITE_API_URL:-}
    <<: [*restart, *logging]
    ports:
      - "${FRONTEND_HOST_PORT:-3001}:3000"
    depends_on:
      - api-gateway

  # ── Nginx Reverse Proxy (MVP default) ───────────────────────────────────────

  nginx:
    image: nginx:alpine
    <<: [*restart, *logging]
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-gateway
      - vision-service
      - frontend

volumes:
  postgres_data:
  postgres_closet_data:
  redis_data:
  redis_state_data:
  uploads:
