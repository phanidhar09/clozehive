# ═══════════════════════════════════════════════════════════════════════════════
#  CLOZEHIVE — Hybrid AI Architecture
#
#  ── Default stack ──────────────────────────────────────────────────────────────
#  Starts: postgres, redis, api-gateway, ai-agent, mcp-weather, mcp-outfit,
#          mcp-packing, frontend, nginx, migrate
#  Command:
#    docker compose up --build
#
#  Architecture:
#    Frontend → nginx → api-gateway (auth/CRUD)
#                    └→ api-gateway /ai/* → ai-agent → MCP tools
#
#  The api-gateway handles auth, closet, trips, and profile CRUD.
#  Chat/outfit generation use OpenAI from the gateway; WebSocket chat and trip packing
#  call ai-agent (MCP tools). Host .env may set AI_AGENT_URL=localhost — the gateway
#  service below forces http://ai-agent:8001 so Docker networking is never wrong.
#  ai-agent MCP tools:
#    - mcp-weather  :8010  weather forecasts
#    - mcp-outfit   :8012  outfit suggestions
#    - mcp-packing  :8013  trip packing lists
#  The api-gateway falls back to in-gateway packing_service if ai-agent is down.
#
#  ── Optional: Kafka async stack ───────────────────────────────────────────────
#  Command:
#    docker compose --profile worker up --build
#  Set KAFKA_ENABLED=true in .env to enable async /ai/* routes and ai-worker.
#
#  ── Optional: Vision MCP (GPU / high-memory) ──────────────────────────────────
#  Command:
#    docker compose --profile vision up --build
#
#  Stop / reset volumes:
#    docker compose down -v
# ═══════════════════════════════════════════════════════════════════════════════

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

# ── Shared env for Python services ───────────────────────────────────────────
x-python-env: &python-env
  OPENAI_API_KEY: ${OPENAI_API_KEY}
  ENVIRONMENT: ${ENVIRONMENT:-development}
  DEBUG: ${DEBUG:-false}
  LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
  LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
  LANGSMITH_API_KEY: ${LANGSMITH_API_KEY}
  LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-clozehive1}

services:

  # ── Infrastructure (MVP default) ──────────────────────────────────────────

  postgres:
    image: pgvector/pgvector:pg16
    <<: [*restart, *logging]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Host 5433 → container 5432 so we don't clash with a local Postgres install.
      # Override by setting POSTGRES_HOST_PORT in .env if you want a different mapping.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    <<: [*restart, *logging]
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory ${REDIS_MAXMEMORY:-512mb}
      --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_HOST_PORT:-6382}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Kafka (optional — profiles ai + worker) ─────────────────────────────────

  redpanda:
    profiles: ["worker"]
    image: redpandadata/redpanda:v24.2.9
    <<: [*restart, *logging]
    command:
      - redpanda
      - start
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092,OUTSIDE://localhost:19092
    ports:
      - "${KAFKA_HOST_PORT:-19092}:19092"
      - "${REDPANDA_ADMIN_HOST_PORT:-19644}:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info --brokers 127.0.0.1:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka-topics:
    profiles: ["worker"]
    image: redpandadata/redpanda:v24.2.9
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:9092
      KAFKA_PARTITIONS: ${KAFKA_PARTITIONS:-6}
      KAFKA_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR:-1}
      KAFKA_RETENTION_MS: ${KAFKA_RETENTION_MS:-604800000}
    volumes:
      - ./infra/kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/sh", "/create-topics.sh"]
    restart: "no"

  redpanda-console:
    profiles: ["worker"]
    image: redpandadata/console:v2.7.2
    <<: [*restart, *logging]
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "${REDPANDA_CONSOLE_HOST_PORT:-8080}:8080"
    depends_on:
      redpanda:
        condition: service_healthy

  # ── MCP Tool Servers (default — core AI features) ────────────────────────
  #
  # These are called exclusively by ai-agent via LangChain MCP adapters (SSE).
  # The api-gateway never calls them directly; it sends all AI requests to ai-agent.

  mcp-weather:
    build:
      context: ./services/mcp
      dockerfile: weather/Dockerfile
    <<: [*restart, *logging]
    environment:
      <<: *python-env
      WEATHER_PORT: "8010"
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
    ports:
      - "8010:8010"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket,sys; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',8010)); s.close()\""]
      interval: 20s
      timeout: 5s
      start_period: 15s
      retries: 3

  mcp-outfit:
    build:
      context: ./services/mcp
      dockerfile: outfit/Dockerfile
    <<: [*restart, *logging]
    environment:
      <<: *python-env
      OUTFIT_PORT: "8012"
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
    ports:
      - "8012:8012"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket,sys; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',8012)); s.close()\""]
      interval: 20s
      timeout: 5s
      start_period: 15s
      retries: 3

  mcp-packing:
    build:
      context: ./services/mcp
      dockerfile: packing/Dockerfile
    <<: [*restart, *logging]
    environment:
      <<: *python-env
      PACKING_PORT: "8013"
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
    ports:
      - "8013:8013"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket,sys; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',8013)); s.close()\""]
      interval: 20s
      timeout: 5s
      start_period: 15s
      retries: 3

  # ── Vision MCP (optional — higher resource usage) ───────────────────────────
  mcp-vision:
    profiles: ["vision", "legacy-mcp"]
    build:
      context: ./services/mcp
      dockerfile: vision/Dockerfile
    <<: [*restart, *logging]
    environment:
      <<: *python-env
      VISION_PORT: "8011"
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
    ports:
      - "8011:8011"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket,sys; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',8011)); s.close()\""]
      interval: 20s
      timeout: 5s
      start_period: 15s
      retries: 3

  # ── AI Agent (default — hybrid AI layer) ─────────────────────────────────────

  ai-agent:
    build:
      context: ./services/ai-agent
      dockerfile: Dockerfile
    <<: [*restart, *logging]
    environment:
      <<: *python-env
      PORT: "8001"
      REDIS_URL: redis://redis:6379/1
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      VECTOR_STORE: pgvector
      OPENAI_MODEL: gpt-4o
      # MCP tools are ON by default — mcp-weather, mcp-outfit, mcp-packing always start.
      ENABLE_MCP_TOOLS: ${ENABLE_MCP_TOOLS:-true}
      ENABLE_MCP_VISION: ${ENABLE_MCP_VISION:-false}
      MCP_WEATHER_URL: ${MCP_WEATHER_URL:-http://mcp-weather:8010/sse}
      MCP_OUTFIT_URL: ${MCP_OUTFIT_URL:-http://mcp-outfit:8012/sse}
      MCP_PACKING_URL: ${MCP_PACKING_URL:-http://mcp-packing:8013/sse}
      MCP_VISION_URL: ${MCP_VISION_URL:-http://mcp-vision:8011/sse}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      # Pin official OpenAI API in containers; override with compose.override.yml for Azure/other bases.
      OPENAI_API_BASE_URL: https://api.openai.com/v1
    ports:
      - "8001:8001"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mcp-weather:
        condition: service_healthy
      mcp-outfit:
        condition: service_healthy
      mcp-packing:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 30s
      timeout: 15s
      start_period: 60s
      retries: 3

  # ── API Gateway (MVP default) ────────────────────────────────────────────────

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    <<: [*restart, *logging]
    # Load repo-root `.env` into the container (same file Compose uses for ${VAR} substitution).
    env_file:
      - .env
    environment:
      <<: *python-env
      PORT: "8000"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-300}
      REDIS_URL: redis://redis:6379/0
      REDIS_CHECK_ON_READY: ${REDIS_CHECK_ON_READY:-true}
      # Must be the Compose service name, not localhost from .env (host dev uses localhost).
      AI_AGENT_URL: http://ai-agent:8001
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      # Override stale OPENAI_* proxy URLs from .env for predictable behavior in Compose.
      OPENAI_API_BASE_URL: https://api.openai.com/v1
      KAFKA_ENABLED: ${KAFKA_ENABLED:-false}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-redpanda:9092}
      JWT_SECRET: ${JWT_SECRET}
      ALLOWED_ORIGINS: http://localhost,http://localhost:80,http://localhost:3000,http://localhost:3001,http://localhost:5173
      # Google OAuth — set these in your .env file
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8000/api/v1/auth/google/callback}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
      # Firebase / Firestore — set FIREBASE_CREDENTIALS_JSON to service account JSON contents
      # or mount a credentials file and set GOOGLE_APPLICATION_CREDENTIALS to its path
      FIREBASE_CREDENTIALS_JSON: ${FIREBASE_CREDENTIALS_JSON:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      # Google Cloud Storage — must be passed explicitly (container does not load repo-root .env).
      GCS_BUCKET_NAME: ${GCS_BUCKET_NAME:-}
      GCS_PROJECT_ID: ${GCS_PROJECT_ID:-}
      GCS_CREDENTIALS_JSON: ${GCS_CREDENTIALS_JSON:-}
      GCS_CREDENTIALS_FILE: ${GCS_CREDENTIALS_FILE:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-agent:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/live')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./services/api-gateway/app:/app/app  # live code mount — no rebuild needed for Python changes
      - uploads:/app/uploads
      # Real GCP key JSON at repo root (see .env GCS_CREDENTIALS_FILE). Create from IAM → Keys → JSON.
      - ./gcp-sa.json:/run/secrets/gcp-sa.json:ro

  # ── Vision Service (MVP default — image analysis and background removal) ─────

  vision-service:
    build:
      context: ./services/vision-service
      dockerfile: Dockerfile
    <<: [*restart, *logging]
    env_file:
      - .env
    environment:
      <<: *python-env
      PORT: "8002"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-300}
      REDIS_URL: redis://redis:6379/2
      JWT_SECRET: ${JWT_SECRET}
      OPENAI_API_BASE_URL: https://api.openai.com/v1
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GCS_BUCKET_NAME: ${GCS_BUCKET_NAME:-}
      GCS_PROJECT_ID: ${GCS_PROJECT_ID:-}
      GCS_CREDENTIALS_JSON: ${GCS_CREDENTIALS_JSON:-}
      GCS_CREDENTIALS_FILE: ${GCS_CREDENTIALS_FILE:-}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/live')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - uploads:/app/uploads
      - ./gcp-sa.json:/run/secrets/gcp-sa.json:ro

  # ── AI Worker (optional — profile worker) ───────────────────────────────────

  ai-worker:
    profiles: ["worker"]
    build:
      context: ./services/ai-worker
      dockerfile: Dockerfile
    <<: [*restart, *logging]
    environment:
      <<: *python-env
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      AI_AGENT_URL: http://ai-agent:8001
      MAX_ATTEMPTS: "5"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      kafka-topics:
        condition: service_completed_successfully
      ai-agent:
        condition: service_started
    volumes:
      - uploads:/app/uploads

  # ── DB Migrations (MVP default — run-once container) ───────────────────────

  migrate:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    command: alembic upgrade head
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ── Frontend (MVP default) ──────────────────────────────────────────────────

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Empty = browser calls same origin; frontend container nginx proxies `/api` + `/uploads` → api-gateway.
        # Set a full URL only if you build a static bundle meant for a separate API host.
        VITE_API_URL: ${VITE_API_URL:-}
    <<: [*restart, *logging]
    ports:
      - "${FRONTEND_HOST_PORT:-3001}:3000"
    depends_on:
      - api-gateway

  # ── Nginx Reverse Proxy (MVP default) ───────────────────────────────────────

  nginx:
    image: nginx:alpine
    <<: [*restart, *logging]
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-gateway
      - vision-service
      - frontend

volumes:
  postgres_data:
  redis_data:
  redpanda_data:
  uploads:
