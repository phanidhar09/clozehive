# Serves the Vite build and proxies API + uploads to api-gateway (Docker network).
# Without this, `serve` returns the SPA for POST /api/... and vision never runs.

server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 20M;

    # Use Docker's embedded DNS so nginx re-resolves service names after restarts
    # instead of caching the IP at startup.
    resolver 127.0.0.11 valid=5s ipv6=off;

    location /api/ {
        set $api_upstream http://api-gateway:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /uploads/ {
        set $api_upstream http://api-gateway:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
