worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Logging ────────────────────────────────────────────────────────────────
    log_format json_combined escape=json
        '{'
        '"time":"$time_iso8601",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":"$status",'
        '"bytes":"$body_bytes_sent",'
        '"latency":"$request_time",'
        '"ua":"$http_user_agent",'
        '"x_request_id":"$http_x_request_id"'
        '}';

    access_log /var/log/nginx/access.log json_combined;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ── Rate limiting zones ───────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=ai:10m rate=10r/s;

    # ── Upstreams ─────────────────────────────────────────────────────────────
    upstream api_gateway {
        server api-gateway:8000;
        keepalive 32;
    }

    upstream vision_service {
        server vision-service:8002;
        keepalive 16;
    }

    # closet-service owns the wardrobe domain + closet-data AI features.
    upstream closet_service {
        server closet-service:8003;
        keepalive 32;
    }

    upstream frontend {
        server frontend:3000;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 20M;

        # ── Vision service — SSE streaming (no timeout, no buffering) ─────────
        location = /api/v1/analyze-vision/stream {
            limit_req zone=ai burst=5 nodelay;
            proxy_pass http://vision_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 0;
            proxy_connect_timeout 30s;
            add_header X-Accel-Buffering no always;
        }

        # ── Vision service — batch analyze + smart-ingest ─────────────────────
        location ~* ^/api/v1/(analyze-vision|save-analyzed-items|smart-ingest) {
            limit_req zone=ai burst=10 nodelay;
            proxy_pass http://vision_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_connect_timeout 30s;
            proxy_read_timeout 120s;
        }

        # ── Vision service — per-item background removal ──────────────────────
        location ~* ^/api/v1/closet/[^/]+/remove-background {
            limit_req zone=ai burst=5 nodelay;
            proxy_pass http://vision_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_read_timeout 120s;
        }

        # ── AI routes — api-gateway proxies these to ai-agent internally ──────
        # These need longer timeouts: LLM calls + MCP tool chains can take 30-60s.
        # ── closet-service — AI/chat SSE streaming (no buffering, no timeout) ─
        # Covers /api/v1/ai/<*>/stream|async (ai.py) and /api/v1/ai-chat/stream
        # (ai_chat.py). Must precede the general closet-domain block below.
        location ~* ^/api/v1/(ai/.+|ai-chat)/(stream|async) {
            limit_req zone=ai burst=5 nodelay;
            proxy_pass http://closet_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # SSE / streaming: disable buffering, no read timeout
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 0;
            proxy_connect_timeout 30s;
            add_header X-Accel-Buffering no always;
        }

        # ── closet-service — wardrobe domain + closet-data AI features ────────
        # Routes the moved domain prefixes to closet-service. The vision_service
        # regexes above (remove-background, smart-ingest) still win for their
        # paths because they appear earlier. 120s read timeout covers AI
        # generation (outfit / trip packing / stylist) which can take ~60-90s.
        location ~* ^/api/v1/(closet|outfits|trips|ai|ai-chat|analytics|shopping|rag|fashion-knowledge|purchase-gaps)(/|$) {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://closet_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_read_timeout 120s;
        }

        # ── General API routes (api-gateway: auth, profile, weather, admin,
        #    social, jobs, ws) ─────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://api_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_read_timeout 120s;
        }

        # ── Tighter limit for auth endpoints ─────────────────────────────────
        location /api/v1/auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://api_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Health check ──────────────────────────────────────────────────────
        location /health {
            proxy_pass http://api_gateway;
            proxy_set_header Host $host;
            access_log off;
        }

        # ── Prometheus metrics — internal scrape only, never public ───────────
        # Allow the Docker/observability network; deny the public internet so the
        # metrics surface (route names, queue depths) isn't exposed.
        location /metrics {
            allow 127.0.0.1;
            allow 172.16.0.0/12;   # Docker bridge networks
            allow 10.0.0.0/8;      # private/orchestrator networks
            deny all;
            proxy_pass http://api_gateway;
            proxy_set_header Host $host;
            access_log off;
        }

        # ── Uploaded garment images ───────────────────────────────────────────
        location /uploads/ {
            proxy_pass http://api_gateway;
            proxy_set_header Host $host;
            access_log off;
        }

        # ── WebSocket — real-time notification channel ────────────────────────
        location /api/v1/ws {
            proxy_pass http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }

        # ── Frontend hashed assets — immutable, cache for a year ──────────────
        # Vite emits content-hashed filenames under /assets/, so the bytes never
        # change. Cache hard at the browser + any CDN edge in front of nginx.
        location /assets/ {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ── Frontend (SPA shell) ──────────────────────────────────────────────
        # index.html must NOT be cached, or clients keep loading stale asset refs
        # after a deploy. Assets it points to are fingerprinted and cached above.
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            add_header Cache-Control "no-cache";
        }
    }
}
