  region: null
  source: curated
  content: >-
    SUMMER colouring is cool, light, and muted — cool skin with a pinkish undertone, blue/grey/cool eyes,
    and ash-blonde or light cool-brown hair. Best colours: dusty rose, lavender, powder blue, soft grey,
    taupe, muted navy, and soft white. Avoid warm oranges, earth tones, and pure black.
