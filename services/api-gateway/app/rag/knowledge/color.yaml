- title: Color Matching Fundamentals
  occasion: null
  season: null
  tags:
  - color theory
  - palette
  - contrast
  gender: unisex
  formality_level: null
  region: null
  source: curated
  content: >-
    Color matching is the foundation of great outfits. Complementary colors (opposite on the color wheel,
    e.g. blue and orange) create bold contrast. Analogous colors (adjacent, e.g. navy, teal, and green)
    create harmonious, sophisticated looks. Neutral colors (black, white, grey, beige, navy) pair with
    almost anything. When in doubt, build a monochromatic outfit in one color family — different shades
    of blue always work together. Avoid mixing more than three colors in one outfit. Warm tones (red,
    orange, yellow) energize; cool tones (blue, green, purple) calm. A pop of color works best when the
    rest of the outfit is neutral.
- title: Skin Tone Color Matching Guide
  occasion: null
  season: null
  tags:
  - skin tone
  - undertone
  - color matching
  - warm cool neutral
  gender: unisex
  formality_level: null
  region: null
  source: curated
  content: >-
    Skin undertone — not how light or dark your skin is — is the most personal factor in choosing colours.
    Find your undertone: golden, peachy, or yellow-based skin is warm; pink, rosy, or blue-based skin is
    cool; skin that fits neither cleanly is neutral (veins that look green lean warm, blue lean cool).
    Match clothing colour to undertone first; skin depth and contrast are a secondary modifier that shifts
    how saturated or high-contrast your best colours should be. See the warm, cool, and neutral undertone
    guides, plus the depth-and-contrast guide, for specific palettes.
- title: Warm Undertone Color Guide
  occasion: null
  season: null
  tags:
  - skin tone
  - warm undertone
  - earth tones
  - color matching
  gender: unisex
  formality_level: null
  region: null
  source: curated
  content: >-
    Warm undertones (golden, peachy, yellow-based skin) are flattered by earth tones — camel, terracotta,
    rust, olive, mustard yellow, warm browns, and off-white or cream — plus warm reds like tomato red and
    coral. Avoid cool icy tones, pastel lavender, and cool pinks, which can leave warm skin looking sallow.
- title: Cool Undertone Color Guide
  occasion: null
  season: null
  tags:
  - skin tone
  - cool undertone
  - jewel tones
  - color matching
  gender: unisex
  formality_level: null
  region: null
  source: curated
  content: >-
    Cool undertones (pink, rosy, blue-based skin) are flattered by jewel tones — sapphire blue, emerald
    green, burgundy, and plum — alongside true white, cool greys, silver accents, lavender, and icy pastels.
    Avoid warm oranges, warm yellows, and strong earth tones, which tend to clash with cool skin.
- title: Neutral Undertone Color Guide
  occasion: null
  season: null
  tags:
  - skin tone
  - neutral undertone
  - color matching
  gender: unisex
  formality_level: null
  region: null
  source: curated
  content: >-
    Neutral undertones (neither clearly warm nor cool) are the most versatile — almost every colour works.
    Let contrast level guide you instead: pick shades that match how much natural contrast you have between
    skin, hair, and eyes, and lean warm or cool by preference rather than necessity. Muted, balanced tones
    are especially reliable.
- title: Skin Depth and Contrast Color Guide
  occasion: null
  season: null
  tags:
  - skin tone
  - depth
  - contrast
  - deep fair olive
  - color matching
  gender: unisex
  formality_level: null
  region: null
  source: curated
  content: >-
    Beyond undertone, your skin's depth and contrast fine-tune saturation. Deep or rich skin carries vivid,
    saturated colours beautifully — jewel tones, rich mustard, coral, and bright white all pop; avoid
    low-contrast beige near the face. Fair or light skin looks striking in high-contrast pairings (navy +
    white, black + white) and soft pastels; avoid very pale tones that wash you out. Olive or medium skin
    (usually warm) suits both warm earthy tones and jewel tones.
- title: Color Season Analysis (Spring Summer Autumn Winter)
  occasion: null
  season: null
  tags:
  - color season
  - seasonal palette
  - personal color analysis
  gender: unisex
  formality_level: null
  region: null
  source: curated
  content: >-
    Color season analysis matches your personal colouring — skin undertone, eye colour, and hair — to one
    of four seasonal palettes so your clothes harmonise with your natural tones. The two axes are warm vs
    cool undertone and light/clear vs deep/muted. Spring is warm-light-clear, Summer cool-light-muted,
    Autumn warm-deep-muted, and Winter cool-deep-clear. Identify your undertone first (warm/golden vs
    cool/pink), then your depth and clarity, and see the individual Spring, Summer, Autumn, and Winter
    guides for full palettes.
- title: Spring Color Palette Guide
  occasion: null
  season: null
  tags:
  - color season
  - spring
  - warm palette
  - personal color analysis
  gender: unisex
  formality_level: null
  region: null
  source: curated
  content: >-
    SPRING colouring is warm, light, and clear — warm skin with a peachy or golden undertone, light or
    hazel eyes, and golden, strawberry-blonde, or light-auburn hair. Best colours: coral, peach, warm
    yellow, light warm greens, turquoise, ivory, and camel. Avoid icy pastels, cool greys, and black next
    to the face.
