  content: >-
    WINTER colouring is cool, deep, and clear — cool or neutral skin, dark or intense eyes, and
    dark-brown/black or starkly contrasted hair. Best colours: true white, jet black, navy, royal blue,
    emerald, ruby red, fuchsia, and icy pastels for contrast. Avoid earth tones and warm yellows.
