  source: curated
  content: >-
    AUTUMN colouring is warm, deep, and muted — golden, olive, or warm skin, amber/hazel/brown/green eyes,
    and chestnut, auburn, or warm-brown hair. Best colours: rust, burnt orange, olive, dark camel, forest
    green, warm brown, teal, and gold. Avoid cool icy pastels, pure black, and cool reds.
