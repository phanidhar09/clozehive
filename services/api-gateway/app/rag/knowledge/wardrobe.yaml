  source: curated
  content: >-
    A capsule wardrobe is a curated collection where every item works together. The 10 essential pieces:
    white shirt, dark jeans, black trousers, little black dress or equivalent, white tee, cashmere/knit
    sweater, blazer, trench coat, tailored chinos, and versatile mid-layer. Color strategy: 70% neutrals,
    20% accent colors, 10% pattern/print. Quality over quantity: invest in well-constructed basics and
    save on trendy pieces. Care rule: items with more versatility (worn 30+ times per year) justify higher
    investment. Review your capsule seasonally: archive items not worn in 12 months. The goal is 37 items
    that create 100+ outfit combinations.
