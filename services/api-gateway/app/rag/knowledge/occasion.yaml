- title: Business Casual Dressing Guide
  occasion: business casual
  season: null
  tags:
  - work
  - office
  - smart casual
  gender: unisex
  formality_level: null
  region: null
  source: curated
  content: >-
    Business casual sits between formal business and casual wear — polished but relaxed, with no suit or
    tie required. Universal rules apply whatever you wear: no ripped clothing, graphic tees, athletic wear,
    or flip-flops, and nothing overly revealing. Safe, versatile colours are navy, grey, burgundy, camel,
    and white. Accessories do the elevating — a quality watch, a good leather belt, or a structured bag
    lifts an otherwise plain outfit instantly.
- title: Men's Business Casual Guide
  occasion: business casual
  season: null
  tags:
  - work
  - office
  - menswear
  - chinos
  gender: men
  formality_level: 1
  region: null
  source: curated
  content: >-
    For men, business casual means chinos or tailored trousers (skip jeans in a stricter office), a
    button-down shirt or a clean polo with no tie required, and loafers or Oxford shoes. A blazer is
    optional and instantly sharpens the look. Keep fits tailored rather than baggy, tuck the shirt when the
    setting is more formal, and match your belt leather to your shoe leather.
- title: Women's Business Casual Guide
  occasion: business casual
  season: null
  tags:
  - work
  - office
  - womenswear
  - blouse
  gender: women
  formality_level: 1
  region: null
  source: curated
  content: >-
    For women, business casual spans blouses with fitted trousers, midi skirts, a dress worn under a blazer,
    or a tailored jumpsuit. Structure is what reads as work-appropriate — a blazer or a defined waist keeps
    softer pieces from looking too casual. Finish with closed or elegant flats and low-to-mid heels, and
    keep hemlines and necklines office-suitable.
- title: Formal Outfit Rules
  occasion: formal
  season: null
  tags:
  - black tie
  - gala
  - formal
  - evening
  gender: unisex
  formality_level: null
  region: null
  source: curated
  content: >-
    Formal dress codes reward precision. Whatever the garment, it must be well-fitted and wrinkle-free,
    the shoes clean and appropriate, and accessories minimal and high-quality. Avoid casual fabrics like
    denim or cotton twill, visible logos, and sneakers. Dark colours — black, navy, charcoal — are the
    classic base; jewel tones such as emerald or sapphire add personality without breaking the formality.
- title: Men's Formal & Black-Tie Guide
  occasion: formal
  season: null
  tags:
  - black tie
  - formal
  - menswear
  - tuxedo
  gender: men
  formality_level: 4
  region: null
  source: curated
  content: >-
    For men, black tie means a tuxedo or a very dark suit with a bow tie; a step down (cocktail or
    "formal") allows a dark suit with a conservative tie. Shoes are polished leather — Oxfords, or patent
    for black tie. Make sure the jacket closes cleanly, the trousers just break at the shoe, and the shirt
    is crisp. Keep accessories restrained: cufflinks and a simple watch, nothing more.
