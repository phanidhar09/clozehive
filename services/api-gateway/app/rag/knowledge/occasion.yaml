  occasion: formal
  season: null
  tags:
  - black tie
  - formal
  - womenswear
  - gown
  gender: women
  formality_level: 4
  region: null
  source: curated
  content: >-
    For women, black tie calls for a floor-length gown or an elegant formal midi; cocktail or "formal"
    allows a knee-length dress or refined separates. Finish with elegant heels or formal flats and minimal,
    high-quality jewellery. Prioritise fabric and fit that hold a clean line — structured crepe, satin, or
    chiffon over anything clingy — and choose a hemline and neckline suited to the venue.
- title: Wedding Guest Outfit Guide
  occasion: wedding
  season: null
  tags:
  - wedding
  - guest
  - ceremony
  gender: unisex
  formality_level: null
  region: null
  source: curated
  content: >-
    As a wedding guest, dress to celebrate without outshining the couple. Avoid white, ivory, and cream
    (reserved for the bride). Avoid all-black unless it is an evening wedding. Smart-casual weddings:
    midi dresses, floral prints, tailored blazer with trousers. Formal weddings: floor-length or tea-length
    dress, dark suit or tuxedo. Beach/garden weddings: light fabrics (chiffon, linen), wedge heels or
    flats (avoid stilettos on grass), floral or pastel tones. Indoor evening weddings: deeper, richer
    colors work well. Always check the venue for footwear suitability.
- title: Smart Casual Style Guide
  occasion: smart casual
  season: null
  tags:
  - smart casual
  - elevated casual
  - dinner
  gender: unisex
  formality_level: null
  region: null
  source: curated
  content: >-
    Smart casual is the most versatile dress code — elevated but not formal. The formula: pair one elevated
    piece (a blazer, a tailored trouser, a structured dress) with one relaxed piece (dark jeans, a simple
    tee). Avoid athletic wear, loud graphics, and flip-flops. Footwear carries the look — Chelsea boots,
    loafers, or clean white sneakers elevate a smart-casual outfit instantly.
