  formality_level: 1
  region: null
  source: curated
  content: >-
    For men, a reliable smart-casual base is dark slim-fit jeans with a button-down shirt or a fine knit,
    finished with leather shoes or clean minimal sneakers. An unstructured blazer or an overshirt adds
    polish without tipping into formal. Keep the palette tight — navy, grey, olive, white — and the fit
    trim rather than loose.
