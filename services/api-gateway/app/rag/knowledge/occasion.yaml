- title: Business Formal and Power Dressing Guide
  occasion: business formal
  season: null
  tags:
  - business formal
  - power dressing
  - corporate
  - interview
  - boardroom
  gender: unisex
  formality_level: 4
  region: null
  source: curated
  content: >-
    Business formal projects precision and authority, and the principles below are shared across audiences.
    Power colours carry meaning: navy signals approachable authority, charcoal reads serious and formal,
    mid-grey is versatile everyday, and black is the most formal — reserve it for the highest-stakes
    settings. Choose structured fabrics (wool, wool-blend, crepe) over anything soft or shiny. Interview
    rule: mirror the company's dress code one level up — a business-casual employer means arrive in business
    formal. Grooming matters as much as the garments. For garment-level fit, see the men's and women's
    guides.
- title: Men's Suit Fit and Tailoring Guide
  occasion: business formal
  season: null
  tags:
  - suit
  - tailoring
  - business formal
  - menswear
  - interview
  gender: men
  formality_level: 4
  region: null
  source: curated
  content: >-
    Men's business formal is won on fit, not on buying more. The jacket: shoulder seams should end exactly
    where your shoulder does (no divot, no overhang); the collar hugs the shirt with no gap; roughly a
    quarter-inch of shirt cuff shows below the sleeve. Fasten the top button of a two-button jacket (never
    the bottom) and unbutton when seated. Trousers: aim for a slight-to-no break — the hem grazes the shoe
    with at most one soft fold. Shirt: a slim or darted cut so it doesn't billow; the collar takes one
    finger. Tie: the tip should just reach the waistband, and its width should roughly mirror the lapel.
    Shoes and belt must match in leather and tone — black with charcoal or navy, brown with lighter greys.
    Suit colours by message: navy = approachable authority, charcoal = serious and formal, mid-grey =
    versatile everyday, black = reserve for the most formal or evening. Choose worsted wool that holds a
    press and avoid shiny blends. A pressed shirt and clean grooming read as put-together faster than any
    accessory.
- title: Women's Power Dressing and Silhouette Guide
  occasion: business formal
  season: null
  tags:
  - power dressing
  - business formal
  - silhouette
  - womenswear
  - interview
  gender: women
  formality_level: 4
  region: null
  source: curated
  content: >-
    Women's business formal offers more silhouettes than menswear, and the organising principle is a clean,
    intentional line — most often through waist definition and structure. Core options: a tailored trouser
    suit (most authority, most versatile), a pencil-skirt-and-blazer pairing (hemline at or just above the
    knee), a structured shift dress under a blazer, or a sharp jumpsuit for modern boardrooms. Fit rules:
    the blazer should close without pulling at the bust, shoulders sit flat, sleeves end at the wrist bone;
    trousers skim rather than cling; skirts still allow a full stride. Fabric does the heavy lifting — wool,
    wool-crepe, ponte, and structured cotton keep their shape and resist wrinkling, while thin jersey that
    clings undermines the line. Heels are optional: a low-to-mid block heel, a pointed flat, or a loafer all
    read as polished, so prioritise what you can walk in confidently. Power colours: navy signals trust,
    charcoal and black read sharp and serious, grey is analytical and neutral, and a single saturated accent
    (oxblood, emerald) adds presence without noise. Keep jewellery minimal and structured.
