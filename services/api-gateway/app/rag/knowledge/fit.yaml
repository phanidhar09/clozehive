- title: Body Fit and Proportion Guidelines
  occasion: null
  season: null
  tags:
  - fit
  - proportion
  - silhouette
  - body
  gender: unisex
  formality_level: null
  region: null
  source: curated
  content: >-
    Good fit is the single biggest factor in how well clothes look. Shoulders: jacket/shirt shoulders
    should sit at the shoulder bone edge — too wide looks sloppy, too narrow restricts movement. Waist:
    defining the waist creates shape; high-waisted bottoms lengthen legs. Trouser break: trousers should
    break once at the top of the shoe for a modern look. Sleeve length: shirt sleeves show 0.5cm beyond
    blazer sleeve. Proportion balancing: wide-leg trousers pair with a fitted or tucked-in top; oversized
    top works with slim bottom; cropped top elongates with high-waisted bottoms. Always prioritize comfort
    and movement — clothes should never restrict or pull.
- title: Body Type Dressing Guide
  occasion: null
  season: null
  tags:
  - body type
  - silhouette
  - hourglass
  - pear
  - apple
  - rectangle
  - petite
  - tall
  gender: unisex
  formality_level: null
  region: null
  source: curated
  content: >-
    Dress to flatter your natural body type and proportions. Hourglass (balanced shoulders and hips, defined
    waist): wrap dresses, fitted blouses, high-waisted trousers, belted coats. Avoid: boxy shapes that
    hide the waist. Pear / triangle (narrower shoulders, wider hips): emphasise the upper body with boat
    necks, statement shoulders, bright tops; choose darker bottoms in straight cuts. Apple / round (weight
    around the midsection): empire waist dresses, A-line skirts, flowy tops, vertical stripe details.
    Avoid: clingy fabrics around the middle. Rectangle / straight (similar shoulder and hip width, minimal
    waist): create curves with peplum tops, ruffles, cropped jackets, wide-leg trousers. Belt everything.
    Inverted triangle (broader shoulders, narrower hips): balance with voluminous bottoms, wide-leg trousers,
    A-line skirts, avoid heavy shoulder details. Petite frames (under 5'4"): high-waisted bottoms elongate
    legs; cropped tops; avoid oversized or heavily layered looks that overwhelm the silhouette. Tall frames
    (over 5'9"): wide-leg trousers, longline coats, maxi dresses all work beautifully; horizontal stripes
    add volume; cropped lengths are flattering. Plus-size: vertical lines, wrap silhouettes, well-fitted
    clothes (never too baggy or too tight). Structured pieces provide shape and confidence.
