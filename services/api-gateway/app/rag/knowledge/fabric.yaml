- title: Natural Fibers Guide (Cotton, Linen, Wool, Silk)
  occasion: null
  season: null
  tags:
  - fabric
  - natural fibers
  - cotton
  - linen
  - wool
  - silk
  - cashmere
  gender: unisex
  formality_level: null
  region: null
  source: curated
  content: >-
    Natural fibers breathe well and generally age gracefully. Cotton: soft, breathable, easy-care,
    everyday-versatile; wrinkles moderately and can shrink. Linen: the coolest, most breathable choice
    for heat — but creases heavily (embrace it as part of the look). Wool: insulating even when damp,
    naturally odour-resistant and wrinkle-shedding; merino is fine and soft for base layers, lambswool
    mid-weight, tweed structured. Cashmere: ultra-soft luxury warmth at low weight; delicate, prone to
    pilling, needs gentle care. Silk: smooth, lightweight, temperature-regulating and dressy; stains and
    water-spots easily, usually dry-clean. Rule of thumb: natural fibers for comfort and longevity;
    match weight to season (lightweight cotton/linen in summer, wool/cashmere in winter).
- title: Synthetic & Performance Fabrics Guide
  occasion: null
  season: null
  tags:
  - fabric
  - synthetic
  - polyester
  - nylon
  - elastane
  - viscose
  - performance
  gender: unisex
  formality_level: null
  region: null
  source: curated
  content: >-
    Synthetics are durable, wrinkle-resistant, and often cheaper, but breathe less. Polyester: tough,
    holds colour and shape, dries fast, resists wrinkles — but can trap heat and odour; common in
    travel-friendly and budget pieces. Nylon: strong and water-resistant, used in outerwear and
    activewear. Elastane/spandex/Lycra: added in small percentages for stretch and recovery (jeans,
    fitted knits, activewear). Viscose/rayon/modal/Tencel (lyocell): semi-synthetic from plant pulp —
    soft, fluid, breathable drape like silk; Tencel/modal are the more sustainable, durable versions.
    Acrylic: wool-like warmth, cheap, but pills and breathes poorly. Use performance blends for travel,
    sport, and rain; favour natural or semi-synthetic (Tencel/modal) for next-to-skin comfort.
- title: Choosing Fabric by Weather & Season
  occasion: null
  season: null
  tags:
  - fabric
  - weather
  - seasonal
  - breathable
  - insulating
  - waterproof
  gender: unisex
  formality_level: null
  region: null
  source: curated
  content: >-
    Match fabric to conditions, not just temperature. Hot & humid: linen, lightweight cotton, chambray,
    and Tencel — loose weaves that breathe and wick; avoid heavy synthetics that trap heat. Cold & dry:
    wool, cashmere, fleece, and down for insulation; layer a merino base under a mid-weight knit. Rain &
    wet: treated/coated nylon and polyester shells, waxed cotton; avoid suede and untreated wool, which
    soak and stain. Transitional spring/autumn: mid-weight cotton, light wool, and denim layer well.
    Air-conditioned interiors in summer: pack one light wool or cotton-knit layer. Travel: wrinkle-
    resistant blends, merino (odour-resistant, re-wearable), and jersey survive a suitcase best.
- title: Fabric Care & Longevity
  occasion: null
  season: null
  tags:
  - fabric care
  - washing
  - storage
  - longevity
  - pilling
  gender: unisex
  formality_level: null
  region: null
  source: curated
  content: >-
    Care drives how long clothes last and look good. Wash less and cooler: cold water preserves colour,
    fit, and fibers, and saves energy; spot-clean and air out between wears (especially wool and denim).
    Always read the care label. Knitwear: fold (never hang — it stretches), wash gently, lay flat to
    dry; de-pill with a fabric comb or shaver. Wool & cashmere: gentle/hand wash or dry-clean sparingly,
    store folded with cedar against moths. Silk & delicates: hand-wash cool or dry-clean; keep out of
    direct sun. Denim: wash rarely and inside-out to keep indigo. Air-dry where possible — tumble drying
    is the biggest cause of shrinkage, pilling, and elastic breakdown. Repair small issues early
    (loose buttons, tiny holes) to extend a garment's life dramatically.
- title: Sustainable & Natural Fiber Choices
  occasion: null
  season: null
  tags:
  - sustainable
  - eco
  - natural fibers
  - organic
  - longevity
  gender: unisex
  formality_level: null
  region: null
  source: curated
  content: >-
    Sustainable fabric choices balance impact, durability, and comfort. Lower-impact fibers: organic
    cotton, linen and hemp (low-water, durable), Tencel/lyocell and modal (closed-loop processing),
    responsibly-sourced wool, and recycled polyester/nylon (keeps plastic out of landfill, though it
    still sheds microfibers). Higher-impact to limit: conventional cotton (water-intensive), virgin
    polyester and acrylic, and anything ultra-cheap built to last a few wears. The single most
    sustainable move is buying fewer, better pieces and wearing them longer — cost-per-wear beats fibre
    choice. Look for certifications (GOTS for organic, OEKO-TEX for low-toxicity) and natural or
    mono-material garments, which are easier to recycle than blends. Wash cool, air-dry, and repair to
    stretch each item's life and shrink its footprint.
