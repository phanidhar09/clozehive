name: CI

on:
  push:
  pull_request:

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lint dependencies
        run: pip install ruff mypy
      - name: Ruff lint (style + import boundaries)
        working-directory: services/api-gateway
        run: ruff check app
      - name: Ruff format check
        working-directory: services/api-gateway
        run: ruff format --check app
      - name: Run mypy
        working-directory: services/api-gateway
        run: mypy app --ignore-missing-imports

  frontend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: ESLint (zero warnings)
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Frontend tests (Vitest)
        run: npm run test
      - name: Production build
        run: npm run build

  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clozehive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/clozehive_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret-with-at-least-thirty-two-characters
      GOOGLE_CLIENT_ID: ci-google-client-id
      GOOGLE_CLIENT_SECRET: ci-google-client-secret
      OPENAI_API_KEY: sk-ci-placeholder
      ANTHROPIC_API_KEY: sk-ant-ci-placeholder
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: Lax
      COOKIE_DOMAIN: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: |
          pip install -r services/api-gateway/requirements.txt
          pip install pytest pytest-asyncio pytest-cov
      - name: Run migrations
        working-directory: services/api-gateway
        run: alembic upgrade head
      - name: Run backend tests (full suite)
        working-directory: services/api-gateway
        run: pytest tests -v --maxfail=1 --cov=app --cov-report=xml:../../coverage-api-gateway.xml --cov-fail-under=50
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: api-gateway-coverage
          path: coverage-api-gateway.xml

  ai-agent-tests:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: sk-ci-placeholder
      OPENAI_API_BASE_URL: https://api.openai.com/v1
      LOG_LEVEL: INFO
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ai-agent dependencies
        run: |
          pip install -r services/ai-agent/requirements.txt
          pip install pytest pytest-asyncio pytest-cov
      - name: Run ai-agent tests
        working-directory: services/ai-agent
        run: pytest tests -v --maxfail=1 --cov=app --cov-report=xml:../../coverage-ai-agent.xml --cov-fail-under=50
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: ai-agent-coverage
          path: coverage-ai-agent.xml

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-lint, frontend-ci, backend-tests, ai-agent-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build api-gateway image
        run: docker build -t clozehive-api:${{ github.sha }} services/api-gateway
      - name: Build frontend image
        run: docker build -t clozehive-frontend:${{ github.sha }} frontend
