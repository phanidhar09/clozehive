name: CI

on:
  push:
  pull_request:

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lint dependencies
        run: pip install flake8 mypy
      - name: Run flake8
        run: flake8 services/api-gateway/app --config services/api-gateway/.flake8
      - name: Run mypy
        run: mypy services/api-gateway/app --ignore-missing-imports

  frontend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: ESLint (zero warnings)
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Frontend tests (Vitest)
        run: npm run test
      - name: Production build
        run: npm run build

  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: closetiq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/closetiq_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret-with-at-least-thirty-two-characters
      GOOGLE_CLIENT_ID: ci-google-client-id
      GOOGLE_CLIENT_SECRET: ci-google-client-secret
      OPENAI_API_KEY: sk-ci-placeholder
      ANTHROPIC_API_KEY: sk-ant-ci-placeholder
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: Lax
      COOKIE_DOMAIN: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: |
          pip install -r services/api-gateway/requirements.txt
          pip install pytest pytest-asyncio pytest-cov
      - name: Run migrations
        working-directory: services/api-gateway
        run: alembic upgrade head
      - name: Run backend tests
        run: pytest services/api-gateway/tests/unit/ -v --cov=app/services --cov-report=xml
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-lint, frontend-ci, backend-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build api-gateway image
        run: docker build -t closetiq-api:${{ github.sha }} services/api-gateway
      - name: Build frontend image
        run: docker build -t closetiq-frontend:${{ github.sha }} frontend
